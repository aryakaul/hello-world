name: Verify a phrase
description: Confirm AI-drafted entries are correct as written.
title: "Verify: "
labels: ["verification"]
body:
  - type: markdown
    attributes:
      value: >
        If you're a native or fluent speaker and the entries are
        right, this flips their badge from "unverified" to
        "verified". Verify one phrase or a whole language — the
        language is already filled in if you came from the site.
  - type: input
    id: language
    attributes:
      label: Language
      description: Language name or slug (e.g. spanish).
    validations:
      required: true
  - type: input
    id: phrase
    attributes:
      label: Phrase
      description: >
        Which phrase (e.g. hello, thank_you, cheers). Leave blank
        if every phrase in this language is correct as written.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: >
            I'm a native or fluent speaker and what I named
            above is correct as written.
          required: true
  - type: input
    id: credit
    attributes:
      label: How should we credit you? (optional)
      description: >
        A name or handle to record in verified_by. Leave blank to
        stay anonymous.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Region, register, or a caveat (optional).
