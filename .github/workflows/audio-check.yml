# Deep audio checks (codec + duration) on PRs that touch audio.
# The Python validator covers path/extension/size with no deps;
# this job adds ffprobe-based checks that need a real decoder.

name: Audio check

on:
  pull_request:
    paths:
      - "data/audio/**"
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 scripts/check_audio.py data
