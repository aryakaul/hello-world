# Deploys the static site to GitHub Pages via Actions.
#
# While the repo is PRIVATE the deploy job is skipped (Pages
# needs a public repo on the free plan); validation still runs
# on every push. Go-live is two steps:
#   1. gh repo edit aryakaul/hello-world --visibility public
#   2. gh api -X POST repos/aryakaul/hello-world/pages \
#        -f build_type=workflow
# then push (or Run workflow) and the site deploys to
# https://aryakaul.github.io/hello-world/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py data
      - run: python3 -m unittest tests.test_validate -v

  deploy:
    needs: validate
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
