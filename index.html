<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport"
	      content="width=device-width, initial-scale=1">
	<title>hello, world</title>
	<!-- Meta content stays on one line: a wrapped attribute
	     carries its newlines and tabs into the value, and not
	     every scraper collapses them. -->
	<meta name="description" content="A simple, user-contributed phrasebook for communicating across the world.">
	<link rel="canonical"
	      href="https://aryakaul.github.io/hello-world/">

	<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
	<link rel="icon" href="icons/icon-32.png" sizes="32x32">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	<link rel="manifest" href="site.webmanifest">
	<meta name="theme-color" content="#fafaf7">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="hello, world">
	<meta property="og:title" content="hello, world">
	<meta property="og:description" content="A simple, user-contributed phrasebook for communicating across the world.">
	<meta property="og:url" content="https://aryakaul.github.io/hello-world/">
	<meta property="og:image" content="https://aryakaul.github.io/hello-world/icons/og-image.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="A globe with green landmasses, beside three example pronunciations.">
	<meta name="twitter:card" content="summary_large_image">

	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<p id="route-status" class="sr-only" role="status"
	   aria-live="polite"></p>
	<main id="app"></main>
	<noscript>
		<p class="noscript">This site builds its pages in the
		browser, so it needs JavaScript switched on. Nothing is
		tracked and nothing is loaded from anywhere else.</p>
	</noscript>
	<footer id="site-footer" class="site-footer"></footer>
	<script src="app.js"></script>
	<script src="globe.js"></script>
</body>
</html>
